<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GXM BOUTIQUE | Collection Capsule</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="style.css">
<script src="script.js"></script>
</head>
<body class="antialiased flex flex-col min-h-screen" data-page="collection.html">
<div id="site-header"></div>
<main class="flex-grow">
<div class="max-w-7xl mx-auto px-6 sm:px-10 py-16">
 <div class="text-center max-w-2xl mx-auto mb-12">
  <span class="text-[11px] uppercase tracking-[0.3em] text-gxm-gold font-medium block mb-3">Pièces uniques • Éditions très limitées</span>
  <h1 class="font-editorial text-4xl sm:text-6xl mb-4">Collection Capsule</h1>
  <p class="text-xs sm:text-sm font-light text-gxm-taupe leading-relaxed">Des créations de créateurs et d’ateliers français pour femme et homme, dans notre palette signature : beige doré, champagne, lin naturel et brun caramel. Choisissez une pièce pour réserver un essayage privé.</p>
 </div>
 <div class="flex flex-wrap justify-center gap-3 mb-14">
  <button onclick="filterCollection('all',this)" class="filter-btn px-5 py-2.5 text-[11px] uppercase tracking-[0.2em] border border-gxm-gold bg-gxm-gold text-white rounded-sm transition-all">Toutes les pièces (<span id="count-all">6</span>)</button>
  <button onclick="filterCollection('femme',this)" class="filter-btn px-5 py-2.5 text-[11px] uppercase tracking-[0.2em] border border-gxm-champagne bg-gxm-cream text-gxm-espresso hover:border-gxm-gold rounded-sm transition-all">Femme</button>
  <button onclick="filterCollection('homme',this)" class="filter-btn px-5 py-2.5 text-[11px] uppercase tracking-[0.2em] border border-gxm-champagne bg-gxm-cream text-gxm-espresso hover:border-gxm-gold rounded-sm transition-all">Homme</button>
  <button onclick="filterCollection('accessoires',this)" class="filter-btn px-5 py-2.5 text-[11px] uppercase tracking-[0.2em] border border-gxm-champagne bg-gxm-cream text-gxm-espresso hover:border-gxm-gold rounded-sm transition-all">Accessoires</button>
 </div>
 <div id="collection-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-10"></div>
</div>
<div id="modal" class="hidden fixed inset-0 z-50 items-center justify-center p-4"></div>
</main>
<div id="site-footer"></div>
</body>
</html>
